<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Nota Tracker</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* ── MODE SELECTOR ── */
    .mode-selector {
      display: flex;
      gap: 0;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .mode-btn {
      flex: 1;
      padding: 0.6rem 0.5rem;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-stack);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .mode-btn:first-child {
      border-right: 1px solid var(--panel-border);
    }
    .mode-btn.active {
      background: var(--accent);
      color: #090d16;
    }
    .mode-btn:not(.active):hover {
      background: rgba(255,255,255,0.06);
      color: var(--text-primary);
    }
    .mode-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      display: block;
    }
    .mode-hint {
      font-size: 0.72rem;
      color: var(--text-secondary);
      text-align: center;
      margin-top: -0.75rem;
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }
    .mode-hint span {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-title">
        <h1>Nota Tracker</h1>
        <p>Circulation Tracking System</p>
      </div>

      <!-- Mode Selector -->
      <div>
        <span class="mode-label">Pilih Mode Tampilan</span>
        <div class="mode-selector">
          <button class="mode-btn active" id="modeDesktop" onclick="setMode('desktop')">
            💻 Desktop
          </button>
          <button class="mode-btn" id="modeMobile" onclick="setMode('mobile')">
            📱 Mobile
          </button>
        </div>
        <p class="mode-hint" id="modeHint">
          <span>Desktop</span>: tampilan lengkap dengan laporan &amp; tabel nota
        </p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="input-control" placeholder="Masukkan username" required autocomplete="username">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="input-control" placeholder="Masukkan password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;" id="submitBtn">
          Login
        </button>
      </form>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    // ── MODE HANDLING ──
    const HINTS = {
      desktop: '<span>Desktop</span>: tampilan lengkap dengan laporan &amp; tabel nota',
      mobile:  '<span>Mobile</span>: tampilan simpel, fokus scan &amp; proses nota'
    };

    let selectedMode = localStorage.getItem('nota_display_mode') || 'desktop';

    function setMode(mode) {
      selectedMode = mode;
      localStorage.setItem('nota_display_mode', mode);
      document.getElementById('modeDesktop').classList.toggle('active', mode === 'desktop');
      document.getElementById('modeMobile').classList.toggle('active', mode === 'mobile');
      document.getElementById('modeHint').innerHTML = HINTS[mode];
    }

    // Restore saved mode on load
    setMode(selectedMode);

    // ── REDIRECT IF ALREADY LOGGED IN ──
    document.addEventListener('DOMContentLoaded', () => {
      const user = Auth.getUser();
      const token = Auth.getToken();
      if (user && token) {
        if (user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submitBtn');

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      try {
        const response = await apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });

        if (response && response.token) {
          Auth.setSession(response.token, {
            id: response.id,
            username: response.username,
            nama_divisi: response.nama_divisi,
            role: response.role
          });

          Toast.show('Login berhasil! Mengalihkan...', 'success');

          setTimeout(() => {
            if (response.role === 'admin') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'dashboard.html';
            }
          }, 1000);
        } else {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Login';
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
