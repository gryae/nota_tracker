<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Nota Tracker</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-title">
        <h1>Nota Tracker</h1>
        <p>Circulation Tracking System</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="input-control" placeholder="Masukkan username" required autocomplete="username">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="input-control" placeholder="Masukkan password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;" id="submitBtn">
          Login
        </button>
      </form>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    // Redirect jika sudah login
    document.addEventListener('DOMContentLoaded', () => {
      const user = Auth.getUser();
      const token = Auth.getToken();
      if (user && token) {
        if (user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submitBtn');

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      try {
        const response = await apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });

        if (response && response.token) {
          Auth.setSession(response.token, {
            id: response.id,
            username: response.username,
            nama_divisi: response.nama_divisi,
            role: response.role
          });

          Toast.show('Login berhasil! Mengalihkan...', 'success');

          setTimeout(() => {
            if (response.role === 'admin') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'dashboard.html';
            }
          }, 1000);
        } else {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Login';
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
